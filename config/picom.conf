# Official Picom. Preserve unfocused terminal transparency and dual-kawase blur.
backend = "glx";
shadow = true;
fading = false;
animations = ();
vsync = true;
use-damage = true;
corner-radius = 18;
opacity-rule = [
  "100:class_g = 'st-256color'",
  "100:class_g = 'Alacritty' && focused",
  "75:class_g = 'Alacritty' && !focused"
];
frame-opacity = 1.0;
inactive-opacity-override = true;
focus-exclude = [ "class_g = 'dwm'", "class_g = 'firefox'", "class_g = 'mpv'",
                  "class_g = 'Chromium'", "class_g = 'qutebrowser'", "class_g = 'Alacritty'" ];
blur: { 
  method = "box";
  # strength = 1; 
};
detect-transient = true;
detect-client-leader = true;
log-level = "warn";
